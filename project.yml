name: mac_tool_pro
options:
  bundleIdPrefix: com.zp.mac-tool-pro
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
targets:
  mac_tool_pro:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/Modules
      - path: Resources/Assets.xcassets
    entitlements:
      path: Resources/App.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zp.shengshoubuying
        PRODUCT_NAME: 圣手捕影
        EXECUTABLE_NAME: ShengShouBuYing
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FinderSyncExt
        embed: true
  FinderSyncExt:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FinderSyncExt
      - path: Sources/Shared
      - path: Resources/Ext-Assets.xcassets
    entitlements:
      path: Resources/Ext.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zp.shengshoubuying.FinderSyncExt
        PRODUCT_NAME: FinderSyncExt
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Ext-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  mac_tool_proTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/mac_tool_proTests
      - path: Sources/Shared
      - path: Sources/Modules
      - path: Sources/App/Settings
      - path: Sources/App/Snippets/SnippetManager.swift
      - path: Sources/App/Snippets/SnippetManagerWindow.swift
      - path: Sources/App/TransferShelf
      - path: Sources/App/Screenshot/PinWindow.swift
      - path: Sources/App/Screenshot/PinContextMenu.swift
      - path: Sources/App/DiagLog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zp.shengshoubuying.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
